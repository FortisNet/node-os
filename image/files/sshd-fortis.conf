# FortisNet host: SSH is for the operator's key only.
# Installed as /etc/ssh/sshd_config.d/10-fortis.conf; sshd reads the first
# value it finds for each setting, and this file is read before the defaults.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AuthenticationMethods publickey
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no
