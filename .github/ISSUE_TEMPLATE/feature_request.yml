name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to be able to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the current behaviour is not enough
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Anything you have already tried
